[project]
authors = [
    { name = "Yerson Alexander Arredondo García", email = "yerson-302@hotmail.com" },
]
name = "tyba-prueba-tecnica"
version = "0.1.0"
description = "Solución para la prueba técnica de Tyba."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
    "pydantic>=2.14.1",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
