
[database]
path = "data/output/tyba.duckdb"

[migrations]
directory = "migrations"

[data]
raw_directory = "data/raw"
output_directory = "data/output"

[pipeline]
snapshots = [
    { batch = "T", file = "movimientos_dia_T.parquet" },
    { batch = "T1", file = "movimientos_dia_T1.parquet" },
]
fail_on_empty = true
